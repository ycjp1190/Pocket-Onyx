name: Build Onyx BLE (private package)

# Runs only when started by hand. The BLE build is for the owner's own unit, so the result
# is uploaded inside a password-protected 7z (password in the repository secret ONYX_PKG_PW).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The runner ships the plain LLVM clang (MSVC target), which the host tests cannot link with.
      # Put the pinned llvm-mingw (the one Find-Clang.ps1 expects) in C:\llvm-mingw so it is found first.
      - name: Install llvm-mingw (pinned, SHA-256 checked)
        shell: powershell
        run: |
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip"
          $sha = "fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd"
          $zip = Join-Path $env:RUNNER_TEMP "llvm-mingw.zip"
          (New-Object System.Net.WebClient).DownloadFile($url, $zip)
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($got -ne $sha) { throw "llvm-mingw SHA-256 mismatch: $got" }
          Expand-Archive $zip -DestinationPath C:\llvm-mingw
          $bin = (Get-ChildItem C:\llvm-mingw -Recurse -Filter clang.exe | Select-Object -First 1).DirectoryName
          Write-Host "llvm-mingw at $bin"
          Add-Content $env:GITHUB_PATH $bin

      # gitee.com often times out from GitHub's runners: fetch the three public JieLi SDK files with retries.
      # get_sdk_files.py skips files that exist and still checks each one's SHA-256.
      - name: Prefetch JieLi SDK boot files (retries)
        shell: bash
        run: |
          base="https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK/raw/5fa84a9b2f723a5e9337ad79dc2ad741fc98fe2d/cpu/wl82/tools"
          dest="custom-fw/third_party/jieli_sdk_files"
          for f in uboot.boot cfg_tool.bin cfg/eq_cfg_hw.bin; do
            mkdir -p "$dest/$(dirname "$f")"
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 180 -o "$dest/$f" "$base/$f"
            ls -l "$dest/$f"
          done

      - name: Build with Build-Onyx-BLE.ps1 (non-interactive)
        shell: powershell
        env:
          ONYX_AUTO_INSTALL: "1"
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Build-Onyx-BLE.ps1 -Yes

      - name: Pack the result with a password
        shell: powershell
        env:
          PW: ${{ secrets.ONYX_PKG_PW }}
        run: |
          if (-not $env:PW) { throw "secret ONYX_PKG_PW is missing" }
          if (-not (Test-Path Onyx-BLE-build)) { throw "no Onyx-BLE-build folder" }
          Get-ChildItem -Recurse Onyx-BLE-build | Format-Table Name, Length
          & 7z a -t7z -mhe=on "-p$env:PW" onyx-ble.7z Onyx-BLE-build | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: onyx-ble-private
          path: onyx-ble.7z
          retention-days: 3
